              { id: 'syllabus', label: '📚 পূর্ণাঙ্গ সিলেবাস' },
              { id: 'routine', label: '⏰ পড়ার রুটিন (12-Hour)' },
              { id: 'timer', label: '⏱️ পোমোডোরো টাইমার' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                  activeTab === tab.id
                    ? 'bg-indigo-600 text-white shadow-xs'
                    : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-8 space-y-6">
            
            {/* Dashboard Tab */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="rounded-3xl bg-gradient-to-r from-indigo-700 to-sky-600 text-white p-6 sm:p-8 shadow-xl">
                  <h2 className="text-2xl sm:text-3xl font-black">স্বাগতম, {user.name}!</h2>
                  <p className="text-xs sm:text-sm text-indigo-100 mt-2 max-w-xl">
                    এইচএসসি সিলেবাসের ১ম ও ২য় পত্রের অধ্যায়ভিত্তিক প্রস্তুতি পরিচালনা করুন। আজই তোমার দৈনিক পড়ার লক্ষ্য পূর্ণ করো।
                  </p>
                  <div className="mt-4 flex flex-wrap items-center gap-3">
                    <button
                      onClick={() => setActiveTab('routine')}
                      className="px-5 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-lg transition-transform active:scale-95"
                    >
                      আজ কী পড়ব? (রুটিন দেখুন)
                    </button>
                    <button
                      onClick={() => setActiveTab('login-logs')}
                      className="px-4 py-2.5 bg-white/20 hover:bg-white/30 text-white font-bold text-xs rounded-xl backdrop-blur-md"
                    >
                      কে কে লগইন করেছে দেখুন
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs">
                    <div className="text-xs font-bold text-slate-500">আজকের পড়ার লক্ষ্য</div>
                    <div className="text-2xl font-black text-indigo-600 mt-1">৩টি টাস্ক</div>
                    <div className="text-[11px] text-slate-400 mt-1">রুটিন অনুযায়ী নির্ধারিত</div>
                  </div>
                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs">
                    <div className="text-xs font-bold text-slate-500">মোট লগইন রেকর্ড</div>
                    <div className="text-2xl font-black text-emerald-600 mt-1">{loginLogs.length} বার</div>
                    <div className="text-[11px] text-slate-400 mt-1">ডেটাবেসে অডিট সংরক্ষিত</div>
                  </div>
                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs">
                    <div className="text-xs font-bold text-slate-500">টাইমার স্টাডি সেশন</div>
                    <div className="text-2xl font-black text-amber-500 mt-1">২৫ মিনিট</div>
                    <div className="text-[11px] text-slate-400 mt-1">ফোকাস মোড উপলব্ধ</div>
                  </div>
                </div>
              </div>
            )}

            {/* Login Logs Tab */}
            {activeTab === 'login-logs' && (
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xs space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100 dark:border-slate-800">
                  <div>
                    <h3 className="text-xl font-black text-slate-900 dark:text-slate-100">👥 লগইন মনিটর অডিট</h3>
                    <p className="text-xs text-slate-500">ওয়েবসাইটে কে কখন লগইন করেছে তার সরাসরি তালিকা</p>
                  </div>
                  <span className="px-3 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 text-xs font-bold border border-emerald-200">
                    মোট লগইন: {loginLogs.length}
                  </span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-200 dark:border-slate-800 text-slate-400 font-bold uppercase text-[10px]">
                        <th className="pb-3 px-3">শিক্ষার্থী</th>
                        <th className="pb-3 px-3">বিভাগ ও বর্ষ</th>
                        <th className="pb-3 px-3">লগইন সময় (12-Hour)</th>
                        <th className="pb-3 px-3">পদ্ধতি</th>
                        <th className="pb-3 px-3">ডিভাইস</th>
                        <th className="pb-3 px-3 text-right">স্ট্যাটাস</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                      {loginLogs.map(l => (
                        <tr key={l.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                          <td className="py-3 px-3">
                            <div className="font-bold text-slate-900 dark:text-slate-100">{l.userName}</div>
                            <div className="text-[11px] text-slate-400">{l.userEmail}</div>
                          </td>
                          <td className="py-3 px-3">
                            <span className="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 text-[10px] font-bold">
                              {l.academicGroup} • {l.currentYear}
                            </span>
                          </td>
                          <td className="py-3 px-3 font-semibold text-slate-700 dark:text-slate-300">
                            {l.loginAtFormatted}
                          </td>
                          <td className="py-3 px-3">
                            <span className="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-700 text-[10px] font-bold">
                              {l.authProvider}
                            </span>
                          </td>
                          <td className="py-3 px-3 text-slate-600 dark:text-slate-400">
                            {l.device}
                          </td>
                          <td className="py-3 px-3 text-right font-bold text-emerald-600">
                            ✓ সফল
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Syllabus Tab */}
            {activeTab === 'syllabus' && (
              <div className="space-y-6">
                <h3 className="text-xl font-black">📚 এইচএসসি সিলেবাস ব্রাউজার</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {currentGroupSyllabus.map(sub => (
                    <div key={sub.id} className="p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-4">
                      <h4 className="text-lg font-bold text-indigo-600 dark:text-indigo-400">{sub.nameBn}</h4>
                      {sub.papers.map(p => (
                        <div key={p.id} className="space-y-2 border-t border-slate-100 dark:border-slate-800 pt-3">
                          <div className="font-bold text-xs uppercase tracking-wider text-slate-400">{p.nameBn}</div>
                          <div className="space-y-2">
                            {p.chapters.map(c => (
                              <div key={c.id} className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-100 dark:border-slate-800">
                                <div className="font-bold text-xs text-slate-900 dark:text-slate-100">{c.nameBn}</div>
                                <div className="text-[11px] text-slate-500 mt-1">
                                  টপিক: {c.topics.join(' • ')}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Routine Tab */}
            {activeTab === 'routine' && (
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-xs space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="text-xl font-black">⏰ আজকের স্টাডি রুটিন (12-Hour Format)</h3>
                  <span className="text-xs text-slate-400 font-bold">৩টি সেশন</span>
                </div>
                <div className="space-y-3">
                  {routines.map(r => (
                    <div
                      key={r.id}
                      onClick={() => toggleRoutine(r.id)}
                      className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${
                        r.done
                          ? 'bg-emerald-50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-800 line-through opacity-70'
                          : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-indigo-400'
                      }`}
                    >
                      <div className="space-y-1">
                        <div className="text-xs font-bold text-indigo-600 dark:text-indigo-400">{r.time}</div>
                        <div className="text-sm font-black text-slate-900 dark:text-slate-100">{r.subject} — {r.chapter}</div>
                        <div className="text-xs text-slate-500">{r.topic}</div>
                      </div>
                      <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center font-bold text-xs ${
                        r.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'
                      }`}>
                        {r.done ? '✓' : ''}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Timer Tab */}
            {activeTab === 'timer' && (
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xs text-center space-y-6 max-w-lg mx-auto">
                <h3 className="text-xl font-black">⏱️ ফোকাস স্টাডি টাইমার</h3>
                <div className="text-6xl font-black font-mono tracking-tight text-indigo-600 dark:text-indigo-400">
                  {formatTime(timerSeconds)}
                </div>
                <div className="flex items-center justify-center gap-3">
                  <button
                    onClick={() => setTimerRunning(!timerRunning)}
                    className="px-6 py-3 rounded-2xl bg-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-600/30"
                  >
                    {timerRunning ? 'পজ করুন (Pause)' : 'শুরু করুন (Start)'}
                  </button>
                  <button
                    onClick={() => { setTimerRunning(false); setTimerSeconds(25 * 60); }}
                    className="px-4 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 font-bold text-sm"
                  >
                    রিসেট
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 text-center text-xs text-slate-400">
            StudyMate AI • সম্পূর্ণ স্ট্যান্ডঅ্যালোন সিঙ্গেল ফাইল সংস্করণ • এইচএসসি স্টুডেন্ট সাপোর্ট
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
